<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body class="yessir-body p5-page">
    <div id="ps2Grid" aria-hidden="true"></div>

    <header>
        <nav class="fade-in delay p5-header">
            <a href="index.html">&larr; Back</a>
        </nav>
    </header>

    <!-- BANNER -->
    <div class="yessir-banner">
        <img src="assets/images/plogo.png" class="plogo" alt="p5 logo">
        <h1 class="p5-overwrite">p5.js</h1>
        <p class="p5-text">SKETCHES!</p>
    </div>

    <!-- SKETCHES GRID -->
    <div class="sketches-section">
        <div class="sketches-grid">
            <a href="https://editor.p5js.org/jreyes101/full/-7fJTMt8v" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk1.png" alt="Sketch 1">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/Jic-wvxPd" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk2.png" alt="Sketch 2">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/Gdw60q8bL" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk3.png" alt="Sketch 3">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/UsOr60B9T" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/self.png" alt="Self Portrait">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/aY6lsipnc" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk4.png" alt="Sketch 4">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/eNC-VnIODy" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk5.png" alt="Sketch 5">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/WQ-yNGsF_" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk6.png" alt="Sketch 6">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/5Z6G6mnU9" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk7.png" alt="Sketch 7">
            </a>
            <a href="https://editor.p5js.org/jreyes101/full/Mc6Y7AWyB" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/sk8.png" alt="Sketch 8">
            </a>
            <a href="https://editor.p5js.org/jreyes101/collections/IPTHGtM1e" class="sketch-card" target="_blank" rel="noopener">
                <img src="./assets/images/ml5.png" alt="ML5 Collection">
            </a>
        </div>
        <p class="p-main-text">&copy; JSON 2025 ALL RIGHTS RESERVED<br>Everything u c here was done by urs truly</p>
    </div>

    <script>
        window.addEventListener("scroll", () => {
            const header = document.querySelector("header");
            if(window.scrollY > 50) header.classList.add("scrolled");
            else header.classList.remove("scrolled");
        });
        const DEFAULT_TILE_BG = "rgba(0,0,0,0.65)";
        const grid = document.getElementById("ps2Grid");
        const palette = ["#ed225d","#00FFFF","#90EE90","#00FFFFFF"];
        const tilesPerBurst=3, tickMs=140, stayOnMs=900;
        function buildGrid(){
            grid.innerHTML="";
            const tileSize=70, gap=4, pad=16;
            const cols=Math.ceil((window.innerWidth-pad)/(tileSize+gap));
            const rows=Math.ceil((window.innerHeight-pad)/(tileSize+gap));
            for(let i=0;i<cols*rows;i++){
                const t=document.createElement("div"); t.className="ps2-tile"; grid.appendChild(t);
            }
        }
        function randomTile(){ const t=grid.children; return t.length?t[Math.floor(Math.random()*t.length)]:null; }
        function light(tile){
            if(!tile) return;
            const color=palette[Math.floor(Math.random()*palette.length)];
            tile.classList.add("on"); tile.style.backgroundColor=color;
            setTimeout(()=>{ tile.classList.remove("on"); tile.style.backgroundColor=DEFAULT_TILE_BG; }, stayOnMs);
        }
        buildGrid(); window.addEventListener("resize",buildGrid);
        setInterval(()=>{ for(let i=0;i<tilesPerBurst;i++) light(randomTile()); }, tickMs);
    </script>
</body>
</html>
