<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Minigames!</title>
    <link rel="icon" type="image/png" href="./assets/images/folio.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body class="yessir-body p5-page">
    <div id="ps2Grid" aria-hidden="true"></div>

    <header>
        <nav class="fade-in delay p5-header">
            <a href="index.html">&larr; Back</a>
        </nav>
    </header>

    <!-- BANNER -->
    <div class="yessir-banner">
        <img src="assets/images/gd.png" class="glogo" alt="Godot logo">
        <h1 class="godot-overwrite">GODOT</h1>
        <p class="g-text">Minigames!</p>
    </div>

    <!-- GAMES GRID -->
    <div class="games-section">
        <div class="games-grid">
            <a href="https://drive.google.com/drive/folders/1M48D1e9Y79X5nhIrPkWlCCHEp2Y8NnNA?usp=sharing"
               class="g-card" target="_blank" rel="noopener">
                <img src="./assets/images/flap.gif" alt="Flap game">
            </a>
            <a href="https://drive.google.com/drive/folders/1S9VrDXimpySp6lXkhvRylBGazVsz5Wiy?usp=sharing"
               class="g-card" target="_blank" rel="noopener">
                <img src="./assets/images/tetry.gif" alt="Tetris game">
            </a>
            <a href="https://drive.google.com/drive/folders/1P8YFBQWCiAmzy37_s9aITp8cWwlZpoO8?usp=sharing"
               class="g-card" target="_blank" rel="noopener">
                <img src="./assets/images/froggiest.gif" alt="Frog game">
            </a>
            <a href="https://drive.google.com/drive/folders/1Xy0uYUutQ1AKfEmzxeEVkiQEmLuET_ID?usp=sharing"
               class="g-card" target="_blank" rel="noopener">
                <img src="./assets/images/snak.gif" alt="Snake game">
            </a>
        </div>
        <p class="p-main-text">&copy; JSON 2025 ALL RIGHTS RESERVED<br>Everything u c here was done by urs truly</p>
    </div>

    <script>
        window.addEventListener("scroll", () => {
            const header = document.querySelector("header");
            header.classList.toggle("scrolled", window.scrollY > 50);
        });
        const DEFAULT_TILE_BG = "rgba(0,0,0,0.65)";
        const grid = document.getElementById("ps2Grid");
        const palette = ["#478cbf","#9a00cd","#90EE90","#00FFFFFF"];
        const tilesPerBurst=3, tickMs=140, stayOnMs=900;
        function buildGrid(){
            grid.innerHTML="";
            const tileSize=70, gap=4, pad=16;
            const cols=Math.ceil((window.innerWidth-pad)/(tileSize+gap));
            const rows=Math.ceil((window.innerHeight-pad)/(tileSize+gap));
            for(let i=0;i<cols*rows;i++){
                const t=document.createElement("div"); t.className="ps2-tile"; grid.appendChild(t);
            }
        }
        function randomTile(){ const t=grid.children; return t.length?t[Math.floor(Math.random()*t.length)]:null; }
        function light(tile){
            if(!tile) return;
            const color=palette[Math.floor(Math.random()*palette.length)];
            tile.classList.add("on"); tile.style.backgroundColor=color;
            setTimeout(()=>{ tile.classList.remove("on"); tile.style.backgroundColor=DEFAULT_TILE_BG; }, stayOnMs);
        }
        buildGrid(); window.addEventListener("resize",buildGrid);
        setInterval(()=>{ for(let i=0;i<tilesPerBurst;i++) light(randomTile()); }, tickMs);
    </script>
</body>
</html>
