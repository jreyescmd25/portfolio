<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview w/ Ramon</title>
    <link rel="icon" type="image/png" href="./assets/images/folio.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body class="yessir-body p5-page">
    <div id="ps2Grid" aria-hidden="true"></div>

    <header>
        <nav class="fade-in delay interview-header">
            <a href="index.html">&larr; Back</a>
        </nav>
    </header>

    <!-- BANNER -->
    <div class="yessir-banner">
        <h1 class="interview-title">Interview w/ Ramon Gao</h1>
    </div>

    <!-- VIDEO -->
    <div class="interview-section">
        <div class="yt-wrapper">
            <iframe
                src="https://www.youtube.com/embed/hakXbMmVmN0?si=LUN-or2uONgPQFMB"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>
        <p class="i-main-text">&copy; JSON 2025 ALL RIGHTS RESERVED<br>Everything u c here was done by urs truly</p>
    </div>

    <script>
        window.addEventListener("scroll", () => {
            const header = document.querySelector("header");
            header.classList.toggle("scrolled", window.scrollY > 50);
        });
        const DEFAULT_TILE_BG = "rgba(0,0,0,0.65)";
        const grid = document.getElementById("ps2Grid");
        const palette = ["#880808","#00FFFF","#EE4B2B","#6a5acd"];
        const tilesPerBurst=3, tickMs=140, stayOnMs=900;
        function buildGrid(){
            grid.innerHTML="";
            const tileSize=70, gap=4, pad=16;
            const cols=Math.ceil((window.innerWidth-pad)/(tileSize+gap));
            const rows=Math.ceil((window.innerHeight-pad)/(tileSize+gap));
            for(let i=0;i<cols*rows;i++){
                const t=document.createElement("div"); t.className="ps2-tile"; grid.appendChild(t);
            }
        }
        function randomTile(){ const t=grid.children; return t.length?t[Math.floor(Math.random()*t.length)]:null; }
        function light(tile){
            if(!tile) return;
            const color=palette[Math.floor(Math.random()*palette.length)];
            tile.classList.add("on"); tile.style.backgroundColor=color;
            setTimeout(()=>{ tile.classList.remove("on"); tile.style.backgroundColor=DEFAULT_TILE_BG; }, stayOnMs);
        }
        buildGrid(); window.addEventListener("resize",buildGrid);
        setInterval(()=>{ for(let i=0;i<tilesPerBurst;i++) light(randomTile()); }, tickMs);
    </script>
</body>
</html>
